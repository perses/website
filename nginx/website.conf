# nginx configuration serving the static website. `make deploy-website` builds it and copies it in ./site.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    # TLS is terminated by traefik: relative redirections keep the https scheme of the visitor.
    absolute_redirect off;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    # text/x-script is the type of the `.data` files, loaded by the client-side navigation.
    gzip_types text/css text/plain text/xml text/x-script application/javascript application/json application/feed+json application/xml application/rss+xml image/svg+xml application/wasm;

    # URLs of the documentation on the previous website (`legacyPath` in website.yaml). The website also contains
    # redirection pages for them, but an HTTP redirection keeps the #anchor of the URL and is better for the search
    # engines.
    rewrite ^/perses/docs/(.*)$ /docs/perses/latest/$1 permanent;
    rewrite ^/perses-operator/docs/(.*)$ /docs/operator/latest/$1 permanent;
    rewrite ^/helm-charts/docs/(.*)$ /docs/helm-charts/$1 permanent;
    rewrite ^/plugins/docs/(.*)$ /docs/plugins/$1 permanent;

    location / {
        try_files $uri $uri/ =404;
    }

    # Files with a hash in their name never change.
    location /assets/ {
        try_files $uri =404;
        location ~* -[A-Za-z0-9_-]{8}\.(js|css|woff2)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location ~ \.data$ {
        default_type text/x-script;
    }

    location ~ \.json$ {
        default_type application/json;
    }

    error_page 404 /404.html;
}
