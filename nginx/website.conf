# nginx configuration serving the static website built in build/client.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/plain text/xml application/javascript application/json application/xml application/rss+xml image/svg+xml application/wasm;

    location / {
        try_files $uri $uri/ =404;
    }

    # Files with a hash in their name never change.
    location /assets/ {
        try_files $uri =404;
        location ~* -[A-Za-z0-9_-]{8}\.(js|css|woff2)$ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    location ~ \.data$ {
        default_type text/x-script;
    }

    error_page 404 /404.html;
}
